[project]
name = "tb-like"
version = "0.3.1"
description = "A faster, columnar TensorBoard-style scalar viewer for many series and many runs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misha Kindulov", email = "kindulov.ml@gmail.com" }]
keywords = ["tensorboard", "parquet", "plotly", "machine-learning", "visualization", "metrics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.137.1",
    "joblib>=1.5.3",
    "numpy>=1.26",
    "plotly>=6.8.0",
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "tensorboard>=2.20.0",
    "tqdm>=4.68.2",
    "uvicorn[standard]>=0.49.0",
]

[project.urls]
Homepage = "https://github.com/b0nce/tb_like"
Repository = "https://github.com/b0nce/tb_like"
Issues = "https://github.com/b0nce/tb_like/issues"

[project.scripts]
tblike = "tblike.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tblike"]

# Ship only source in the sdist — never local run/cache/demo data that may sit
# in the working tree (an unignored dir of symlinks once ballooned this to 198MB).
[tool.hatch.build.targets.sdist]
include = ["tblike", "README.md", "LICENSE", "pyproject.toml"]
